<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Bakehouse</title>
        <link rel="icon" type="image/png" href="/images/logo/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/logo/favicon.svg" />
    <link rel="shortcut icon" href="/images/logo/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logo/apple-touch-icon.png" />
    <link rel="manifest" href="/images/logo/site.webmanifest" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-centered">
            <a href="/" class="logo"><img src="/images/logo/dc_flat_logo.svg" alt="Bakehouse"></a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/products.html">Products</a></li>
                <li><a href="/our-story.html">Our Story</a></li>
                <li><a href="/cart.html" class="cart-link">Cart <span id="cart-count" class="badge">0</span></a></li>
                <li id="auth-nav"></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <div class="checkout-form" style="margin: 0 auto;">
                    <h2 class="auth-title" style="text-align:center; margin-bottom: 2rem;">My Profile</h2>

                    <div id="profile-error" class="error-msg" style="display:none;"></div>

                    <form id="profile-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="profile-email">Email</label>
                                <input type="email" id="profile-email" disabled style="background:#f0f0f0; cursor:not-allowed;">
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="tel" id="phone" disabled style="background:#f0f0f0; cursor:not-allowed;">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="first_name">First Name</label>
                                <input type="text" id="first_name" name="first_name">
                            </div>
                            <div class="form-group">
                                <label for="last_name">Last Name</label>
                                <input type="text" id="last_name" name="last_name">
                            </div>
                            <div class="form-group">
                                <label for="organization">Organization</label>
                                <input type="text" id="organization" name="organization" placeholder="Company or organization (optional)">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="shipping_address">Address</label>
                            <input type="text" id="shipping_address" name="shipping_address" placeholder="Street address, P.O. box">
                        </div>
                        <div class="form-group">
                            <label for="shipping_address2">Address Line 2</label>
                            <input type="text" id="shipping_address2" name="shipping_address2" placeholder="Apt, suite, unit, floor (optional)">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="shipping_city">City</label>
                                <input type="text" id="shipping_city" name="shipping_city">
                            </div>
                            <div class="form-group">
                                <label for="shipping_state">State</label>
                                <select id="shipping_state" name="shipping_state">
                                    <option value="">Select state</option>
                                    <option value="AL">Alabama</option>
                                    <option value="AK">Alaska</option>
                                    <option value="AZ">Arizona</option>
                                    <option value="AR">Arkansas</option>
                                    <option value="CA">California</option>
                                    <option value="CO">Colorado</option>
                                    <option value="CT">Connecticut</option>
                                    <option value="DE">Delaware</option>
                                    <option value="DC">District of Columbia</option>
                                    <option value="FL">Florida</option>
                                    <option value="GA">Georgia</option>
                                    <option value="HI">Hawaii</option>
                                    <option value="ID">Idaho</option>
                                    <option value="IL">Illinois</option>
                                    <option value="IN">Indiana</option>
                                    <option value="IA">Iowa</option>
                                    <option value="KS">Kansas</option>
                                    <option value="KY">Kentucky</option>
                                    <option value="LA">Louisiana</option>
                                    <option value="ME">Maine</option>
                                    <option value="MD">Maryland</option>
                                    <option value="MA">Massachusetts</option>
                                    <option value="MI">Michigan</option>
                                    <option value="MN">Minnesota</option>
                                    <option value="MS">Mississippi</option>
                                    <option value="MO">Missouri</option>
                                    <option value="MT">Montana</option>
                                    <option value="NE">Nebraska</option>
                                    <option value="NV">Nevada</option>
                                    <option value="NH">New Hampshire</option>
                                    <option value="NJ">New Jersey</option>
                                    <option value="NM">New Mexico</option>
                                    <option value="NY">New York</option>
                                    <option value="NC">North Carolina</option>
                                    <option value="ND">North Dakota</option>
                                    <option value="OH">Ohio</option>
                                    <option value="OK">Oklahoma</option>
                                    <option value="OR">Oregon</option>
                                    <option value="PA">Pennsylvania</option>
                                    <option value="RI">Rhode Island</option>
                                    <option value="SC">South Carolina</option>
                                    <option value="SD">South Dakota</option>
                                    <option value="TN">Tennessee</option>
                                    <option value="TX">Texas</option>
                                    <option value="UT">Utah</option>
                                    <option value="VT">Vermont</option>
                                    <option value="VA">Virginia</option>
                                    <option value="WA">Washington</option>
                                    <option value="WV">West Virginia</option>
                                    <option value="WI">Wisconsin</option>
                                    <option value="WY">Wyoming</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="shipping_zip">ZIP Code</label>
                                <input type="text" id="shipping_zip" name="shipping_zip" inputmode="numeric" maxlength="10" autocomplete="postal-code">
                            </div>
                        </div>

                        <div id="profile-success" class="success-msg" style="display:none; opacity:0; transition: opacity 400ms ease; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1.5rem;">
                            <img src="/images/logo/success-logo.png" alt="Success" style="height: 28px; width: auto;">
                            <span>Profile updated successfully!</span>
                        </div>

                        <div style="margin-top: 1.5rem;">
                            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Date &amp; Crumb. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/cart.js"></script>
    <script src="/js/auth-nav.js"></script>
    <script src="/js/address-autocomplete.js"></script>
    <script src="/js/phone-format.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('profile-form');
            const errorDiv = document.getElementById('profile-error');
            const successDiv = document.getElementById('profile-success');
            const zipInput = document.getElementById('shipping_zip');
            const ZIP_REGEX = /^\d{5}(?:-\d{4})?$/;
            let successHideDelayTimeoutId;
            let successFadeTimeoutId;

            function normalizeZip(value) {
                const digits = String(value || '').replace(/\D/g, '').slice(0, 9);
                if (digits.length <= 5) return digits;
                return `${digits.slice(0, 5)}-${digits.slice(5)}`;
            }

            if (zipInput) {
                zipInput.value = normalizeZip(zipInput.value);
                zipInput.addEventListener('input', () => {
                    zipInput.value = normalizeZip(zipInput.value);
                });
                zipInput.addEventListener('blur', () => {
                    zipInput.value = normalizeZip(zipInput.value);
                });
            }

            try {
                const res = await fetch('/api/auth/profile');
                if (!res.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const { profile } = await res.json();
                document.getElementById('profile-email').value = profile.email || '';
                document.getElementById('phone').value = profile.phone || '';
                document.getElementById('first_name').value = profile.first_name || '';
                document.getElementById('last_name').value = profile.last_name || '';
                document.getElementById('organization').value = profile.organization || '';
                document.getElementById('shipping_address').value = profile.shipping_address || '';
                document.getElementById('shipping_address2').value = profile.shipping_address2 || '';
                document.getElementById('shipping_city').value = profile.shipping_city || '';
                document.getElementById('shipping_state').value = profile.shipping_state || '';
                document.getElementById('shipping_zip').value = normalizeZip(profile.shipping_zip || '');
            } catch (e) {
                window.location.href = '/login.html';
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
                successDiv.style.opacity = '0';
                if (successHideDelayTimeoutId) {
                    clearTimeout(successHideDelayTimeoutId);
                    successHideDelayTimeoutId = null;
                }
                if (successFadeTimeoutId) {
                    clearTimeout(successFadeTimeoutId);
                    successFadeTimeoutId = null;
                }

                try {
                    const normalizedZip = normalizeZip(document.getElementById('shipping_zip').value.trim());
                    document.getElementById('shipping_zip').value = normalizedZip;
                    if (!ZIP_REGEX.test(normalizedZip)) {
                        errorDiv.textContent = 'Please enter ZIP Code as XXXXX or XXXXX-XXXX.';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    const res = await fetch('/api/auth/profile', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            first_name: document.getElementById('first_name').value.trim(),
                            last_name: document.getElementById('last_name').value.trim(),
                            organization: document.getElementById('organization').value.trim(),
                            shipping_address: document.getElementById('shipping_address').value.trim(),
                            shipping_address2: document.getElementById('shipping_address2').value.trim(),
                            shipping_city: document.getElementById('shipping_city').value.trim(),
                            shipping_state: document.getElementById('shipping_state').value,
                            shipping_zip: normalizedZip,
                        }),
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        errorDiv.textContent = data.error || 'Failed to save profile.';
                        errorDiv.style.display = 'block';
                        return;
                    }
                    successDiv.style.display = 'flex';
                    successDiv.style.opacity = '1';
                    successHideDelayTimeoutId = setTimeout(() => {
                        successDiv.style.opacity = '0';
                        successFadeTimeoutId = setTimeout(() => {
                            successDiv.style.display = 'none';
                            successFadeTimeoutId = null;
                        }, 400);
                        successHideDelayTimeoutId = null;
                    }, 5000);
                } catch (err) {
                    if (successHideDelayTimeoutId) {
                        clearTimeout(successHideDelayTimeoutId);
                        successHideDelayTimeoutId = null;
                    }
                    if (successFadeTimeoutId) {
                        clearTimeout(successFadeTimeoutId);
                        successFadeTimeoutId = null;
                    }
                    successDiv.style.opacity = '0';
                    successFadeTimeoutId = setTimeout(() => {
                        successDiv.style.display = 'none';
                        successFadeTimeoutId = null;
                    }, 400);
                    errorDiv.textContent = 'Something went wrong. Please try again.';
                    errorDiv.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
