<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — Bakehouse</title>
        <link rel="icon" type="image/png" href="/images/logo/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/logo/favicon.svg" />
    <link rel="shortcut icon" href="/images/logo/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logo/apple-touch-icon.png" />
    <link rel="manifest" href="/images/logo/site.webmanifest" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-centered">
            <a href="/" class="logo"><img src="/images/logo/bakehouse_logo.jpg" alt="Bakehouse"></a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/products.html">Products</a></li>
                <li><a href="/our-story.html">Our Story</a></li>
                <li><a href="/cart.html" class="cart-link">Cart <span id="cart-count" class="badge">0</span></a></li>
                <li id="auth-nav"></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <div class="checkout-form" style="margin: 0 auto;">
                    <h2 class="auth-title" style="text-align:center; margin-bottom: 2rem;">My Profile</h2>

                    <div id="profile-error" class="error-msg" style="display:none;"></div>
                    <div id="profile-success" class="success-msg" style="display:none;"></div>

                    <form id="profile-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="profile-email">Email</label>
                                <input type="email" id="profile-email" disabled style="background:#f0f0f0; cursor:not-allowed;">
                            </div>
                            <div class="form-group">
                                <label for="profile-phone">Phone</label>
                                <input type="tel" id="profile-phone" disabled style="background:#f0f0f0; cursor:not-allowed;">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="profile-name">Full Name</label>
                                <input type="text" id="profile-name" name="name">
                            </div>
                            <div class="form-group">
                                <label for="profile-organization">Organization</label>
                                <input type="text" id="profile-organization" name="organization" placeholder="Company or organization (optional)">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="profile-address">Address</label>
                            <input type="text" id="profile-address" name="shipping_address" placeholder="Street address, P.O. box">
                        </div>
                        <div class="form-group">
                            <label for="profile-address2">Address Line 2</label>
                            <input type="text" id="profile-address2" name="shipping_address2" placeholder="Apt, suite, unit, floor (optional)">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="profile-city">City</label>
                                <input type="text" id="profile-city" name="shipping_city">
                            </div>
                            <div class="form-group">
                                <label for="profile-state">State</label>
                                <select id="profile-state" name="shipping_state">
                                    <option value="">Select state</option>
                                    <option value="NY">New York</option>
                                    <option value="NJ">New Jersey</option>
                                    <option value="CT">Connecticut</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="profile-zip">ZIP Code</label>
                                <input type="text" id="profile-zip" name="shipping_zip">
                            </div>
                        </div>

                        <div style="margin-top: 1.5rem;">
                            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Bakehouse. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/cart.js"></script>
    <script src="/js/auth-nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('profile-form');
            const errorDiv = document.getElementById('profile-error');
            const successDiv = document.getElementById('profile-success');

            try {
                const res = await fetch('/api/auth/profile');
                if (!res.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const { profile } = await res.json();
                document.getElementById('profile-email').value = profile.email || '';
                document.getElementById('profile-phone').value = profile.phone || '';
                document.getElementById('profile-name').value = profile.name || '';
                document.getElementById('profile-organization').value = profile.organization || '';
                document.getElementById('profile-address').value = profile.shipping_address || '';
                document.getElementById('profile-address2').value = profile.shipping_address2 || '';
                document.getElementById('profile-city').value = profile.shipping_city || '';
                document.getElementById('profile-state').value = profile.shipping_state || '';
                document.getElementById('profile-zip').value = profile.shipping_zip || '';
            } catch (e) {
                window.location.href = '/login.html';
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';

                try {
                    const res = await fetch('/api/auth/profile', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: document.getElementById('profile-name').value.trim(),
                            organization: document.getElementById('profile-organization').value.trim(),
                            shipping_address: document.getElementById('profile-address').value.trim(),
                            shipping_address2: document.getElementById('profile-address2').value.trim(),
                            shipping_city: document.getElementById('profile-city').value.trim(),
                            shipping_state: document.getElementById('profile-state').value,
                            shipping_zip: document.getElementById('profile-zip').value.trim(),
                        }),
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        errorDiv.textContent = data.error || 'Failed to save profile.';
                        errorDiv.style.display = 'block';
                        return;
                    }
                    successDiv.textContent = 'Profile updated successfully!';
                    successDiv.style.display = 'block';
                } catch (err) {
                    errorDiv.textContent = 'Something went wrong. Please try again.';
                    errorDiv.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
