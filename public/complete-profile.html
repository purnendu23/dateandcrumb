<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile — Bakehouse</title>
        <link rel="icon" type="image/png" href="/images/logo/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/images/logo/favicon.svg" />
    <link rel="shortcut icon" href="/images/logo/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logo/apple-touch-icon.png" />
    <link rel="manifest" href="/images/logo/site.webmanifest" />
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-centered">
            <a href="/" class="logo"><img src="/images/logo/dc_flat_logo.svg" alt="Bakehouse"></a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/products.html">Products</a></li>
                <li><a href="/our-story.html">Our Story</a></li>
                <li><a href="/cart.html" class="cart-link">Cart <span id="cart-count" class="badge">0</span></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="section">
            <div class="container">
                <div class="checkout-form" style="margin: 0 auto;">
                    <div style="text-align: center; margin-bottom: 2rem;">
                        <h2 class="auth-title" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                            <img src="/images/logo/success-logo.png" alt="Success" style="height: 36px; width: auto;">
                            Email Verified!
                        </h2>
                        <p style="color: var(--color-text-light); margin-top: 0.5rem;">
                            Complete your profile so we can ship orders to you faster.
                        </p>
                    </div>

                    <div id="profile-error" class="error-msg" style="display:none;"></div>

                    <form id="profile-form">
                        <h2>Shipping Information</h2>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="first_name">First Name *</label>
                                <input type="text" id="first_name" name="first_name" required>
                            </div>
                            <div class="form-group">
                                <label for="last_name">Last Name *</label>
                                <input type="text" id="last_name" name="last_name" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone</label>
                                <input type="tel" id="phone" name="phone" placeholder="(optional)">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="organization">Organization</label>
                            <input type="text" id="organization" name="organization" placeholder="Company or organization (optional)">
                        </div>
                        <div class="form-group">
                            <label for="shipping_address">Address *</label>
                            <input type="text" id="shipping_address" name="shipping_address" required placeholder="Street address, P.O. box">
                        </div>
                        <div class="form-group">
                            <label for="shipping_address2">Address Line 2</label>
                            <input type="text" id="shipping_address2" name="shipping_address2" placeholder="Apt, suite, unit, floor (optional)">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="shipping_city">City *</label>
                                <input type="text" id="shipping_city" name="shipping_city" required>
                            </div>
                            <div class="form-group">
                                <label for="shipping_state">State *</label>
                                <select id="shipping_state" name="shipping_state" required>
                                    <option value="">Select state</option>
                                    <option value="AL">Alabama</option>
                                    <option value="AK">Alaska</option>
                                    <option value="AZ">Arizona</option>
                                    <option value="AR">Arkansas</option>
                                    <option value="CA">California</option>
                                    <option value="CO">Colorado</option>
                                    <option value="CT">Connecticut</option>
                                    <option value="DE">Delaware</option>
                                    <option value="DC">District of Columbia</option>
                                    <option value="FL">Florida</option>
                                    <option value="GA">Georgia</option>
                                    <option value="HI">Hawaii</option>
                                    <option value="ID">Idaho</option>
                                    <option value="IL">Illinois</option>
                                    <option value="IN">Indiana</option>
                                    <option value="IA">Iowa</option>
                                    <option value="KS">Kansas</option>
                                    <option value="KY">Kentucky</option>
                                    <option value="LA">Louisiana</option>
                                    <option value="ME">Maine</option>
                                    <option value="MD">Maryland</option>
                                    <option value="MA">Massachusetts</option>
                                    <option value="MI">Michigan</option>
                                    <option value="MN">Minnesota</option>
                                    <option value="MS">Mississippi</option>
                                    <option value="MO">Missouri</option>
                                    <option value="MT">Montana</option>
                                    <option value="NE">Nebraska</option>
                                    <option value="NV">Nevada</option>
                                    <option value="NH">New Hampshire</option>
                                    <option value="NJ">New Jersey</option>
                                    <option value="NM">New Mexico</option>
                                    <option value="NY">New York</option>
                                    <option value="NC">North Carolina</option>
                                    <option value="ND">North Dakota</option>
                                    <option value="OH">Ohio</option>
                                    <option value="OK">Oklahoma</option>
                                    <option value="OR">Oregon</option>
                                    <option value="PA">Pennsylvania</option>
                                    <option value="RI">Rhode Island</option>
                                    <option value="SC">South Carolina</option>
                                    <option value="SD">South Dakota</option>
                                    <option value="TN">Tennessee</option>
                                    <option value="TX">Texas</option>
                                    <option value="UT">Utah</option>
                                    <option value="VT">Vermont</option>
                                    <option value="VA">Virginia</option>
                                    <option value="WA">Washington</option>
                                    <option value="WV">West Virginia</option>
                                    <option value="WI">Wisconsin</option>
                                    <option value="WY">Wyoming</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="shipping_zip">ZIP Code *</label>
                                <input type="text" id="shipping_zip" name="shipping_zip" required inputmode="numeric" maxlength="10" autocomplete="postal-code">
                            </div>
                        </div>

                        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                            <a href="/" class="btn btn-outline" style="text-align: center;">Skip for Now</a>
                            <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;">Save Profile</button>
                        </div>
                    </form>

                    <!-- Success state (hidden initially) -->
                    <div id="profile-success" style="display:none; text-align: center;">
                        <h2 class="auth-title" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                            <img src="/images/logo/success-logo.png" alt="Success" style="height: 36px; width: auto;">
                            You're All Set!
                        </h2>
                        <p style="color: var(--color-text-light); margin: 1rem 0;">
                            Your profile has been saved. You're ready to start shopping!
                        </p>
                        <a href="/products.html" class="btn btn-primary" style="margin-top: 1rem;">Browse Products</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Date &amp; Crumb. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/cart.js"></script>
    <script src="/js/address-autocomplete.js"></script>
    <script src="/js/phone-format.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('profile-form');
            const errorDiv = document.getElementById('profile-error');
            const successDiv = document.getElementById('profile-success');
            const zipInput = document.getElementById('shipping_zip');
            const ZIP_REGEX = /^\d{5}(?:-\d{4})?$/;

            function normalizeZip(value) {
                const digits = String(value || '').replace(/\D/g, '').slice(0, 9);
                if (digits.length <= 5) return digits;
                return `${digits.slice(0, 5)}-${digits.slice(5)}`;
            }

            if (zipInput) {
                zipInput.value = normalizeZip(zipInput.value);
                zipInput.addEventListener('input', () => {
                    zipInput.value = normalizeZip(zipInput.value);
                });
                zipInput.addEventListener('blur', () => {
                    zipInput.value = normalizeZip(zipInput.value);
                });
            }

            // Pre-fill shipping profile from account if available
            try {
                const res = await fetch('/api/auth/profile');
                if (res.ok) {
                    const { profile } = await res.json();
                    if (profile.first_name) document.getElementById('first_name').value = profile.first_name;
                    if (profile.last_name) document.getElementById('last_name').value = profile.last_name;
                    if (profile.phone) document.getElementById('phone').value = profile.phone;
                    if (profile.organization) document.getElementById('organization').value = profile.organization;
                    if (profile.shipping_address) document.getElementById('shipping_address').value = profile.shipping_address;
                    if (profile.shipping_address2) document.getElementById('shipping_address2').value = profile.shipping_address2;
                    if (profile.shipping_city) document.getElementById('shipping_city').value = profile.shipping_city;
                    if (profile.shipping_state) document.getElementById('shipping_state').value = profile.shipping_state;
                    if (profile.shipping_zip) document.getElementById('shipping_zip').value = normalizeZip(profile.shipping_zip);
                } else {
                    // Not logged in — redirect to login
                    window.location.href = '/login.html';
                    return;
                }
            } catch (e) {
                // Ignore — user can still fill the form manually
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorDiv.style.display = 'none';

                const first_name = document.getElementById('first_name').value.trim();
                const last_name = document.getElementById('last_name').value.trim();
                const address = document.getElementById('shipping_address').value.trim();
                const city = document.getElementById('shipping_city').value.trim();
                const state = document.getElementById('shipping_state').value;
                const zip = normalizeZip(document.getElementById('shipping_zip').value.trim());
                document.getElementById('shipping_zip').value = zip;

                if (!first_name || !last_name || !address || !city || !state || !zip) {
                    errorDiv.textContent = 'Please fill in all required fields.';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (!ZIP_REGEX.test(zip)) {
                    errorDiv.textContent = 'Please enter ZIP Code as XXXXX or XXXXX-XXXX.';
                    errorDiv.style.display = 'block';
                    return;
                }

                try {
                    const res = await fetch('/api/auth/profile', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            first_name,
                            last_name,
                            phone: document.getElementById('phone').value.trim(),
                            organization: document.getElementById('organization').value.trim(),
                            shipping_address: address,
                            shipping_address2: document.getElementById('shipping_address2').value.trim(),
                            shipping_city: city,
                            shipping_state: state,
                            shipping_zip: zip,
                        }),
                    });
                    const data = await res.json();

                    if (!res.ok) {
                        errorDiv.textContent = data.error || 'Failed to save profile.';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    // Show success
                    form.style.display = 'none';
                    document.querySelector('.checkout-form > div:first-child').style.display = 'none';
                    successDiv.style.display = 'block';
                } catch (err) {
                    errorDiv.textContent = 'Something went wrong. Please try again.';
                    errorDiv.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
